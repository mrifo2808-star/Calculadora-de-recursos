# Incidente 2026-08-29/30: el repo paso a privado y GitHub apago Pages solo (Pages con
# repo privado requiere plan pago); al volver a publico, Settings -> Pages NO se
# restauro solo — quedo en "Deploy from a branch: main /(root)" (sirviendo el index.html
# de codigo fuente sin build, o simplemente "site not found"), y hubo que reelegir a mano
# Source = "GitHub Actions". Si esto vuelve a pasar: Settings -> Pages -> Source ->
# "GitHub Actions" -> Save, despues Actions -> "Deploy to GitHub Pages" -> Run workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node-version: la version de Node que corre npm ci/npm run build (nuestro
          # codigo), NO la del runtime interno de las Actions de abajo (eso lo fija cada
          # action en su propio action.yml, no aqui). Node 20 esta soportado hasta abril
          # 2026 (LTS) — evaluar subir esto aparte, no es lo que pedia el aviso de
          # deprecacion original (ver VALIDAR del 2026-08-30).
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
